services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - smarth2wo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.YOURDOMAIN.tech
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - smarth2wo-network

networks:
  smarth2wo-network:
    driver: bridge
